name: Notify frontend on docs change

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend sync
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/horse-3903/horse-3903-frontend/dispatches \
            -d '{"event_type":"sync-minsky-docs"}'
